name: Dependabot

version: 2

updates:
  # Dependencias de runtime del backend.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    groups:
      python-dependencies:
        patterns: ["*"]

  # Dependencias de runtime del frontend (requirements.txt) y de desarrollo
  # (dev-requirements.txt) en la raíz del repositorio.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
