name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate data & golden cases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate processed data
        run: node scripts/validate-data.mjs

  # Extender cuando se cierre el stack (D-003):
  # - lint/test/build backend
  # - lint/test/build frontend
